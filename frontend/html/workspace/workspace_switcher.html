<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Donee — Workspace Manager</title>

    <link rel="stylesheet" href="../../css/tokens.css" />
    <link rel="stylesheet" href="../../css/components.css" />
    <link rel="stylesheet" href="../../css/workspace.css" />
  </head>
  <body class="workspace-page">
    <div class="bg"></div>

    <main class="workspace-shell">
      <aside class="workspace-sidebar" id="workspaceSidebar"></aside>

      <section class="workspace-main">
        <header class="workspace-topbar">
          <div class="workspace-title-wrap">
            <p class="workspace-kicker">Workspace manager</p>
            <h1 class="workspace-title">Your spaces</h1>
            <p class="workspace-title-sub">
              Click a workspace to open it. Use the actions to rename or configure.
            </p>
          </div>

          <div class="workspace-topbar-actions">
            <button
              id="openCreateModalBtn"
              class="workspace-icon-btn"
              type="button"
              aria-label="Create new workspace"
              title="New workspace"
            >＋</button>
          </div>
        </header>

        <div id="pageFeedback" class="workspace-feedback"></div>

        <section class="workspace-panel">
          <div id="workspaceListEmpty" class="workspace-empty">
            <h3>No workspaces yet</h3>
            <p>Hit the + button above to create your first workspace.</p>
          </div>

          <div id="workspaceList" class="workspace-list"></div>
        </section>
      </section>
    </main>

    <!-- Create workspace modal -->
    <div id="createWorkspaceModal" class="task-modal-overlay hidden">
      <div class="task-modal">
        <div class="task-modal-head">
          <div>
            <h2 class="workspace-form-title">New workspace</h2>
            <p class="workspace-form-copy">Give your new space a name to get started.</p>
          </div>
          <button
            id="createModalCloseBtn"
            class="workspace-icon-btn task-close-btn"
            type="button"
            aria-label="Close"
          >✕</button>
        </div>

        <form id="createWorkspaceForm" class="task-form">
          <div class="workspace-form-row">
            <label class="label" for="createWorkspaceName">Workspace name</label>
            <input
              class="input"
              id="createWorkspaceName"
              name="createWorkspaceName"
              type="text"
              placeholder="e.g. Design Studio"
              maxlength="50"
              autocomplete="off"
            />
          </div>

          <p id="createError" class="workspace-inline-error"></p>

          <div class="workspace-form-actions">
            <button id="createWorkspaceSubmitBtn" class="button" type="submit">
              Create workspace
            </button>
            <button id="createModalCancelBtn" class="workspace-ghost-btn" type="button">
              Cancel
            </button>
          </div>
        </form>
      </div>
    </div>

    <script type="module" src="../../js/workspace.js"></script>
  </body>
</html>
